<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dashboard - Montanha Bilhar e Jukebox</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#84cc16">
    
    <!-- iOS / Apple Specific Meta Tags for Offline Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Montanha">
    <link rel="apple-touch-icon" href="icon-192.svg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script>
      // Prevents flash of unstyled content (FOUC) by applying the theme before the page loads.
      if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.remove('dark')
      } else {
        document.documentElement.classList.add('dark')
      }
      // Configure Tailwind to use the 'dark' class for dark mode
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <style>
      html, body, #root {
        height: 100%;
        overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile which feels native */
        padding-top: env(safe-area-inset-top);
      }
      body {
        font-family: 'Inter', sans-serif;
        background-attachment: fixed;
      }
      /* Custom Marker Cluster Styles */
      .marker-cluster-small {
        background-color: rgba(30, 136, 229, 0.6); /* Blueish, semi-transparent */
      }
      .marker-cluster-small div {
        background-color: rgba(30, 136, 229, 0.9);
        color: #fff;
      }
      .marker-cluster-medium {
        background-color: rgba(245, 124, 0, 0.6); /* Orangish */
      }
      .marker-cluster-medium div {
        background-color: rgba(245, 124, 0, 0.9);
        color: #fff;
      }
      .marker-cluster-large {
        background-color: rgba(211, 47, 47, 0.6); /* Redish */
      }
      .marker-cluster-large div {
        background-color: rgba(211, 47, 47, 0.9);
        color: #fff;
      }

      /* Custom DivIcon Marker Styles */
      .custom-marker {
        transition: transform 0.2s ease-out;
      }
      .custom-marker.selected-marker {
        z-index: 1000 !important;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          filter: drop-shadow(0 0 2px #fff);
        }
        50% {
          transform: scale(1.2);
          filter: drop-shadow(0 0 10px #06b6d4);
        }
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 2px #fff);
        }
      }

      /* Pulsing indicator animation */
      @keyframes pulse-indicator {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 2px currentColor);
        }
        50% {
          transform: scale(1.15);
          filter: drop-shadow(0 0 6px currentColor);
        }
      }
      .pulse-indicator {
        animation: pulse-indicator 2s infinite ease-in-out;
      }


      /* Hide number input spinners */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type=number] {
        -moz-appearance: textfield;
        appearance: textfield;
      }

      /* Print-specific styles */
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background-color: #ffffff !important;
          background-image: none !important;
          padding-top: 0;
        }
        main {
          padding: 0 !important;
          overflow: visible !important;
          width: 100% !important;
        }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0"
  }
}
</script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-900 transition-colors duration-300">
    <div id="root"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
